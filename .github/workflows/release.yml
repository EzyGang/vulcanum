name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        required: true
        type: choice
        options:
          - full
          - alpha

permissions:
  contents: write

jobs:
  metadata:
    name: Resolve release metadata
    strategy:
      matrix:
        runner:
          - ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    outputs:
      name: ${{ steps.tag.outputs.name }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      previous_tag: ${{ steps.tag.outputs.previous_tag }}
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Parse version
        id: version
        run: |
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute tag
        id: tag
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$RELEASE_TYPE" = "alpha" ]; then
            latest_alpha=$(git tag --list "v${VERSION}-alpha.*" --sort=-v:refname | head -1 || true)
            if [ -z "$latest_alpha" ]; then
              alpha_num=1
              previous_tag=$(git tag --list 'v*' --sort=-v:refname | grep -v '\-alpha' | head -1 || true)
            else
              alpha_num=$(echo "$latest_alpha" | sed 's/.*-alpha\.//')
              alpha_num=$((alpha_num + 1))
              previous_tag="$latest_alpha"
            fi
            tag="v${VERSION}-alpha.${alpha_num}"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            previous_tag=$(git tag --list 'v*' --sort=-v:refname | grep -v '\-alpha' | head -1 || true)
            tag="v${VERSION}"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${previous_tag:-}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build binaries
        run: cargo build --locked --release --target "${{ matrix.target }}" --bin vulcanum --bin vulcanum-server

      - name: Package binaries
        env:
          TARGET: ${{ matrix.target }}
        run: |
          archive="vulcanum-${TARGET}.tar.gz"
          tar -czf "$archive" -C "target/${TARGET}/release" vulcanum vulcanum-server
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: vulcanum-${{ matrix.target }}
          path: |
            vulcanum-${{ matrix.target }}.tar.gz
            vulcanum-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  approval:
    name: Approve release
    needs:
      - metadata
      - build
    strategy:
      matrix:
        runner:
          - ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    environment: release
    steps:
      - name: Confirm approval
        run: echo "Release ${{ needs.metadata.outputs.tag }} approved"

  containers:
    name: Build ${{ matrix.image.name }} (${{ matrix.architecture.name }})
    needs:
      - metadata
      - approval
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: backend
            file: server/docker/Dockerfile
          - name: frontend
            file: frontend/docker/Dockerfile
        architecture:
          - name: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - name: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.architecture.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing architecture image
        id: image
        env:
          IMAGE: ghcr.io/ezygang/vulcanum/${{ matrix.image.name }}:${{ needs.metadata.outputs.tag }}-${{ matrix.architecture.name }}
        run: |
          if docker buildx imagetools inspect "$IMAGE"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: ${{ matrix.architecture.platform }}
          push: true
          tags: ghcr.io/ezygang/vulcanum/${{ matrix.image.name }}:${{ needs.metadata.outputs.tag }}-${{ matrix.architecture.name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.tag }}
            org.opencontainers.image.revision=${{ needs.metadata.outputs.sha }}
          cache-from: type=registry,ref=ghcr.io/ezygang/vulcanum/${{ matrix.image.name }}:deps-${{ matrix.architecture.name }}
          cache-to: type=registry,ref=ghcr.io/ezygang/vulcanum/${{ matrix.image.name }}:deps-${{ matrix.architecture.name }},mode=max,compression=zstd

  container-manifests:
    name: Publish ${{ matrix.image }} manifest
    needs:
      - metadata
      - containers
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        runner:
          - ubuntu-24.04
        image:
          - backend
          - frontend
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-architecture manifest
        env:
          IMAGE: ghcr.io/ezygang/vulcanum/${{ matrix.image }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$TAG" \
            "$IMAGE:$TAG-amd64" \
            "$IMAGE:$TAG-arm64"

  release:
    name: Publish release
    needs:
      - metadata
      - approval
      - container-manifests
    strategy:
      matrix:
        runner:
          - ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: vulcanum-*
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ needs.metadata.outputs.sha }}
          name: ${{ needs.metadata.outputs.name }}
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          generate_release_notes: true
          previous_tag: ${{ needs.metadata.outputs.previous_tag || null }}
          files: dist/*
          fail_on_unmatched_files: true
